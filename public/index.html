<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Bitcoin Price Tracker</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #ffffff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            max-width: 400px;
            width: 100%;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateY(-5px);
        }
        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 10px;
        }
        .price {
            font-size: 2.5rem;
            font-weight: 700;
            color: #f7931a; /* Bitcoin Orange */
            margin-bottom: 20px;
        }
        .status {
            font-size: 0.85rem;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            display: inline-block;
        }
        .loading {
            color: #94a3b8;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Official Bitcoin Logo SVG -->
        <svg class="logo" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="16" cy="16" r="16" fill="#F7931A"/>
            <path d="M21.07 13.56c.27-1.82-1.09-2.8-2.95-3.46l.6-2.41-1.46-.36-.58 2.37c-.38-.09-.77-.18-1.16-.27l.59-2.39-1.46-.36-.6 2.41c-.32-.07-.63-.15-.94-.22l-2.03-.49-.39 1.56s1.09.25 1.07.27c.6.15.71.54.69.85l-.69 2.78c.04.01.09.03.13.05l-.14-.04-.97 3.9c-.07.18-.25.45-.66.35.02.03-1.07-.27-1.07-.27l-.74 1.71 1.91.47c.36.09.71.18 1.06.27l-.6 2.43 1.46.36.6-2.42c.39.11.77.21 1.15.3l-.59 2.41 1.46.36.6-2.43c2.46.47 4.31.28 5.09-1.93.63-1.81-.03-2.85-1.34-3.53.95-.22 1.67-.85 1.86-2.14zm-3.32 4.67c-.45 1.81-3.53.83-4.52.59l.81-3.25c.99.25 4.15.74 3.71 2.66zm.44-4.7c-.41 1.65-2.98.81-3.81.6l.74-2.98c.83.21 3.5.62 3.07 2.38z" fill="white"/>
        </svg>
        
        <h1>Bitcoin Live Price</h1>
        <div class="price" id="btc-price"><span class="loading">Loading...</span></div>
        <div><span class="status" id="status-text">Connected to Cloud API</span></div>
    </div>

    <script>
        async function fetchBtcPrice() {
            try {
                // Vercel par hamari Python API /api se call hogi
                let response = await fetch('/api');
                let data = await response.json();
                
                if(data.status === "success" && data.price_usd !== "N/A") {
                    let formattedPrice = Number(data.price_usd).toLocaleString('en-US', {
                        style: 'currency',
                        currency: 'USD'
                    });
                    document.getElementById('btc-price').innerText = formattedPrice;
                } else {
                    document.getElementById('btc-price').innerText = "Error fetching";
                }
            } catch (error) {
                document.getElementById('btc-price').innerText = "Connection Failed";
            }
        }

        // Pehli dafa load hone par call ho
        fetchBtcPrice();

        // Har 10 seconds ke baad automatically price update ho (Real-time automation)
        setInterval(fetchBtcPrice, 10000);
    </script>
</body>
</html>
